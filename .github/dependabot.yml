version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /packages/common
      - /rads/cost-service
      - /rads/csav/registry-service
      - /rads/log-service
      - /rads/pdm-service
      - /rads/result-consumer
      - /rads/sce/execution-service
      - /rads/transparency-portal
      - /secure-rads/cost-service
      - /secure-rads/log-service
      - /secure-rads/pdm-service
      - /secure-rads/result-consumer
      - /secure-rads/sce/execution-service
      - /secure-rads/transparency-portal
      - /secure-rads/verifier-service
      - /seeding
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directories:
      - /packages/go-common
      - /rads/samples/spend-analysis-go
      - /rads/sce/execution-service/host-tools
      - /secure-rads/csav/registry-service
      - /secure-rads/samples/spend-analysis-go
      - /secure-rads/sce-unit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directories:
      - /benchmark
      - /rads/samples/health-risk-python
      - /rads/samples/trial-eligibility-python
      - /secure-rads/samples/health-risk-python
      - /secure-rads/samples/trial-eligibility-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
