name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts_lint: ${{ steps.ts_lint.outputs.changes }}
      ts_typecheck: ${{ steps.ts_typecheck.outputs.changes }}
      go: ${{ steps.go.outputs.changes }}
      python: ${{ steps.python.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: ts_lint
        uses: dorny/paths-filter@v4
        with:
          filters: |
            'packages/common':
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/cost-service':
              - 'rads/cost-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/csav/registry-service':
              - 'rads/csav/registry-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/log-service':
              - 'rads/log-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/telemetry-service':
              - 'rads/telemetry-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/pdm-service':
              - 'rads/pdm-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/result-consumer':
              - 'rads/result-consumer/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/sce/execution-service':
              - 'rads/sce/execution-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/transparency-portal':
              - 'rads/transparency-portal/**'
              - '.github/workflows/ci.yml'
            'secure/cost-service':
              - 'secure/cost-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/log-service':
              - 'secure/log-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/telemetry-service':
              - 'secure/telemetry-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/pdm-service':
              - 'secure/pdm-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/sce/execution-service':
              - 'secure/sce/execution-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/transparency-portal':
              - 'secure/transparency-portal/**'
              - '.github/workflows/ci.yml'
            'secure/verifier-service':
              - 'secure/verifier-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'seeding':
              - 'seeding/**'
              - '.github/workflows/ci.yml'
      - id: ts_typecheck
        uses: dorny/paths-filter@v4
        with:
          filters: |
            'packages/common':
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/cost-service':
              - 'rads/cost-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/csav/registry-service':
              - 'rads/csav/registry-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/log-service':
              - 'rads/log-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/telemetry-service':
              - 'rads/telemetry-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/pdm-service':
              - 'rads/pdm-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/result-consumer':
              - 'rads/result-consumer/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'rads/sce/execution-service':
              - 'rads/sce/execution-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/cost-service':
              - 'secure/cost-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/log-service':
              - 'secure/log-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/telemetry-service':
              - 'secure/telemetry-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/pdm-service':
              - 'secure/pdm-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/sce/execution-service':
              - 'secure/sce/execution-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'secure/verifier-service':
              - 'secure/verifier-service/**'
              - 'packages/common/**'
              - '.github/workflows/ci.yml'
            'seeding':
              - 'seeding/**'
              - '.github/workflows/ci.yml'
      - id: go
        uses: dorny/paths-filter@v4
        with:
          filters: |
            'packages/go-common':
              - 'packages/go-common/**'
              - '.github/workflows/ci.yml'
            'secure/sce-unit':
              - 'secure/sce-unit/**'
              - 'packages/go-common/**'
              - '.github/workflows/ci.yml'
      - id: python
        uses: dorny/paths-filter@v4
        with:
          filters: |
            'benchmark':
              - 'benchmark/**'
              - '.github/workflows/ci.yml'

  lint-typescript:
    needs: changes
    if: needs.changes.outputs.ts_lint != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.ts_lint) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.package }}
      - run: bun run lint
        working-directory: ${{ matrix.package }}

  typecheck-typescript:
    needs: changes
    if: needs.changes.outputs.ts_typecheck != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.ts_typecheck) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.package }}
      - run: bun run typecheck
        working-directory: ${{ matrix.package }}

  python:
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff==0.17.4 check .
        working-directory: benchmark
      - run: uvx ruff==0.17.4 format --check .
        working-directory: benchmark

  go:
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go build ./...
        working-directory: ${{ matrix.module }}
