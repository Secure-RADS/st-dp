name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      ts_lint: ${{ steps.detect.outputs.ts_lint }}
      ts_typecheck: ${{ steps.detect.outputs.ts_typecheck }}
      go: ${{ steps.detect.outputs.go }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        run: ./.github/scripts/changed-areas.sh
        env:
          BEFORE: ${{ github.event.before }}

  lint-typescript:
    needs: changes
    if: needs.changes.outputs.ts_lint != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.ts_lint) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.package }}
      - run: bun run lint
        working-directory: ${{ matrix.package }}

  typecheck-typescript:
    needs: changes
    if: needs.changes.outputs.ts_typecheck != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.ts_typecheck) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.package }}
      - run: bun run typecheck
        working-directory: ${{ matrix.package }}

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff==0.17.4 check .
        working-directory: benchmark
      - run: uvx ruff==0.17.4 format --check .
        working-directory: benchmark

  go:
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go build ./...
        working-directory: ${{ matrix.module }}
