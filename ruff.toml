# ruff.toml for Python 3.12 project with Google docstrings
# Mirrors prdai/research-navigator coding standards.

# --- Core Settings ---

line-length = 120
target-version = "py312"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".serverless",
    ".aws-sam",
    "cdk.out",
    # Pre-existing standalone sample, not part of the package.
    "sample_code.py",
]

# --- Formatter Configuration ---
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# --- Linter Settings ---
[lint]
select = ["ALL"]

ignore = [
    "DJ",
    "EXE",
    "T10",
    "S",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D401",
    "D205",
    "D212",
    "E402",
    "TRY003",
    "TD002",
    "TD003",
    "FIX002",
    "RET504",
    "PGH004",
    "INP001",
    "COM812",
    "TRY",
    "ANN401",
    "G004",
]

fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["nitro_attestation"]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]

"tests/**/*.py" = [
    "S101",
    "D10",
    "ANN",
]
