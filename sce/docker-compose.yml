services:
  execution-service:
    image: execution-service:latest
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION}
      - ALGORITHM_TABLE=${ALGORITHM_TABLE}
      - RUN_RESULTS_QUEUE_URL=${RUN_RESULTS_QUEUE_URL}
      - RUN_RESULTS_TABLE=${RUN_RESULTS_TABLE}
      - VERIFIER_HOST=${VERIFIER_HOST}
      - PDM_HOST=${PDM_HOST}
      - LOG_HOST=${LOG_HOST}
      - ENCLAVE_AMI_ID=${ENCLAVE_AMI_ID}
      - ENCLAVE_INSTANCE_TYPE=${ENCLAVE_INSTANCE_TYPE}
      - ENCLAVE_SECURITY_GROUP_ID=${ENCLAVE_SECURITY_GROUP_ID}
      - ENCLAVE_INSTANCE_PROFILE_ARN=${ENCLAVE_INSTANCE_PROFILE_ARN}
    restart: unless-stopped
