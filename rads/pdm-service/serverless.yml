service: rads-pdm-service

# Bundled as CJS, not ESM, same as secure-rads' pdm-service - esbuild's ESM output can't interop with
# plain top-level require() in some deps, and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:Query
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rads-personal-data-*"
  environment:
    PDM_TABLE_PREFIX: rads-personal-data
    LOG_HOST: ${env:LOG_HOST_RADS}
    COST_HOST: ${env:COST_HOST_RADS}

functions:
  records:
    handler: src/handlers/records.handler
    timeout: 29
    events:
      - httpApi:
          method: GET
          path: /records
  subject:
    handler: src/handlers/subject.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          method: GET
          path: /subject/{dataSubjectId}

resources:
  Resources:
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

  Outputs:
    PdmTablePrefix:
      Value: rads-personal-data
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
