service: rads-log-service

build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:BatchWriteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt SubjectAccessTable.Arn
  environment:
    SUBJECT_ACCESS_TABLE: !Ref SubjectAccessTable

functions:
  subjectAccessIngest:
    handler: src/handlers/subjectAccessIngest.handler
    events:
      - httpApi:
          method: POST
          path: /subject-access
  subjectAccessBySubject:
    handler: src/handlers/subjectAccessBySubject.handler
    events:
      - httpApi:
          method: GET
          path: /subject-access/{dataSubjectId}
  subjectAccessAll:
    handler: src/handlers/subjectAccessAll.handler
    events:
      - httpApi:
          method: GET
          path: /subject-access

resources:
  Resources:
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

    SubjectAccessTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: rads-subject-access
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: DataSubjectId
            AttributeType: S
          - AttributeName: Sk
            AttributeType: S
        KeySchema:
          - AttributeName: DataSubjectId
            KeyType: HASH
          - AttributeName: Sk
            KeyType: RANGE

  Outputs:
    SubjectAccessTableName:
      Value: !Ref SubjectAccessTable
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
