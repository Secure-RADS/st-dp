service: rads-registry-service

# Bundled as CJS, not ESM, same as the secure-rads services - esbuild's ESM output can't interop with plain
# top-level require() in some deps, and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${param:region, 'ap-southeast-2'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - !GetAtt ImagesBucket.Arn
            - !Sub "${ImagesBucket.Arn}/*"
        - Effect: Allow
          Action: dynamodb:PutItem
          Resource: !GetAtt AlgorithmsTable.Arn
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: ${param:logEventsQueueArn, ''}
  environment:
    ARTIFACT_BUCKET: !Ref ImagesBucket
    DYNAMO_TABLE: !Ref AlgorithmsTable
    # The rads-log-events queue lives in another stack - its URL/ARN are passed in at deploy time.
    LOG_EVENTS_QUEUE_URL: ${param:logEventsQueueUrl, ''}

functions:
  upload:
    handler: src/handlers/upload.handler
    events:
      - httpApi:
          method: POST
          path: /upload
  # Triggered by the ImagesBucket ObjectCreated notification wired in resources below, not by HTTP.
  register:
    handler: src/handlers/register.handler

resources:
  Resources:
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: rads-images
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        NotificationConfiguration:
          LambdaConfigurations:
            - Event: s3:ObjectCreated:*
              Filter:
                S3Key:
                  Rules:
                    - Name: suffix
                      Value: .tar
              Function: !GetAtt RegisterLambdaFunction.Arn

    # The Serverless s3 event can't target a bucket this same stack creates, so the notification is wired by hand.
    RegisterLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt RegisterLambdaFunction.Arn
        Principal: s3.amazonaws.com
        SourceArn: !GetAtt ImagesBucket.Arn
        SourceAccount: !Ref AWS::AccountId

    AlgorithmsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        TableName: rads-algorithms
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH

  Outputs:
    ImagesBucketName:
      Value: !Ref ImagesBucket
    AlgorithmsTableName:
      Value: !Ref AlgorithmsTable
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
