service: rads-telemetry-service

build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt RunLogTable.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - !GetAtt EventQueue.Arn
            - !GetAtt EventDeadLetterQueue.Arn
  environment:
    RUN_LOG_TABLE: !Ref RunLogTable
    EVENT_QUEUE_URL: !Ref EventQueue

functions:
  events:
    handler: src/handlers/events.handler
    events:
      - httpApi:
          method: POST
          path: /events
  worker:
    handler: src/handlers/worker.handler
    timeout: 30
    reservedConcurrency: 5
    events:
      - sqs:
          arn: !GetAtt EventQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
  byAlgorithm:
    handler: src/handlers/byAlgorithm.handler
    events:
      - httpApi:
          method: GET
          path: /logs/{algorithmId}
  all:
    handler: src/handlers/all.handler
    events:
      - httpApi:
          method: GET
          path: /logs

resources:
  Resources:
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

    RunLogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: rads-telemetry-events
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
          - AttributeName: Sk
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH
          - AttributeName: Sk
            KeyType: RANGE

    EventQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rads-telemetry-events
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt EventDeadLetterQueue.Arn
          maxReceiveCount: 5

    EventDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rads-telemetry-events-dlq
        MessageRetentionPeriod: 1209600

  Outputs:
    RunLogTableName:
      Value: !Ref RunLogTable
    EventQueueUrl:
      Value: !Ref EventQueue
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
