AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CSAV stack: EC2 instance running the CSAV module.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.nano
    Description: EC2 instance type for the CSAV instance. t4g.nano (Graviton/ARM) is the cheapest general-purpose type available.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  CsavSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the CSAV instance.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  CsavInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref CsavSecurityGroup
      Tags:
        - Key: Name
          Value: csav

Outputs:
  CsavInstanceId:
    Value: !Ref CsavInstance

  CsavInstancePublicIp:
    Value: !GetAtt CsavInstance.PublicIp
