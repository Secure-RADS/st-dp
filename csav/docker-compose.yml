services:
  registry-service:
    image: registry-service:latest
    ports:
      - "8080:8080"
    environment:
      - ARTIFACT_BUCKET=${ARTIFACT_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - DYNAMO_TABLE=${DYNAMO_TABLE}
      - VERIFIER_URL=${VERIFIER_URL}
      - VERIFIER_PUBKEY_SHA256=${VERIFIER_PUBKEY_SHA256}
      - VERIFIER_HOST=${VERIFIER_HOST}
      - VERIFIER_HOST_PUBKEY_SHA256=${VERIFIER_HOST_PUBKEY_SHA256}
      - PDM_HOST=${PDM_HOST}
      - PDM_HOST_PUBKEY_SHA256=${PDM_HOST_PUBKEY_SHA256}
      - LOG_HOST=${LOG_HOST}
      - LOG_HOST_PUBKEY_SHA256=${LOG_HOST_PUBKEY_SHA256}
    restart: unless-stopped
