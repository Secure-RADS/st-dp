services:
  registry-service:
    image: registry-service:latest
    ports:
      - "8080:8080"
    environment:
      - ARTIFACT_BUCKET=${ARTIFACT_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - DYNAMO_TABLE=${DYNAMO_TABLE}
      - VERIFIER_URL=${VERIFIER_URL}
      - VERIFIER_ATTEST_URL=${VERIFIER_ATTEST_URL}
      - VERIFIER_PUBKEY_SHA256=${VERIFIER_PUBKEY_SHA256}
      - PDMS_URL=${PDMS_URL}
      - PDMS_PUBKEY_SHA256=${PDMS_PUBKEY_SHA256}
    restart: unless-stopped
