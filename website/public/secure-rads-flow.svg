<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Secure RADS protected data flow</title>
  <desc id="desc">Personal records enter an attested secure enclave. An approved algorithm computes inside the enclave and releases an aggregate result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" stroke="#686861" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="759" height="559" rx="2" fill="#F8F8F6" stroke="#D3D3CE"/>
  <text x="34" y="46" fill="#686861" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">SECURE COMPUTATION, STEP BY STEP</text>

  <text x="42" y="104" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">PERSONAL DATA</text>
  <text x="42" y="124" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing=".5">remains with its controller</text>
  <g stroke="#161616" stroke-width="1.4">
    <rect x="42" y="157" width="128" height="45" rx="3" fill="#fff"/>
    <rect x="50" y="210" width="128" height="45" rx="3" fill="#fff"/>
    <rect x="58" y="263" width="128" height="45" rx="3" fill="#fff"/>
  </g>
  <g fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing=".7">
    <text x="62" y="184">RECORD 01</text><text x="70" y="237">RECORD 02</text><text x="78" y="290">RECORD 03</text>
  </g>
  <g fill="#161616">
    <circle cx="151" cy="179" r="3"/><circle cx="159" cy="179" r="3"/><circle cx="167" cy="179" r="3"/>
    <circle cx="159" cy="232" r="3"/><circle cx="167" cy="232" r="3"/><circle cx="175" cy="232" r="3"/>
    <circle cx="167" cy="285" r="3"/><circle cx="175" cy="285" r="3"/><circle cx="183" cy="285" r="3"/>
  </g>

  <path d="M194 232h55" stroke="#686861" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="202" y="215" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing=".8">ENCRYPTED</text>

  <rect x="270.5" y="116.5" width="295" height="260" rx="10" fill="#F0F0ED" stroke="#AFAFA8" stroke-dasharray="5 5"/>
  <text x="294" y="146" fill="#686861" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">ATTESTED ENCLAVE</text>
  <text x="294" y="165" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="10">isolated compute boundary</text>
  <rect x="301" y="190" width="234" height="139" rx="5" fill="#fff" stroke="#161616" stroke-width="1.4"/>
  <g stroke="#161616" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M329 237v-8a14 14 0 0 1 28 0v8"/>
    <rect x="324" y="237" width="38" height="31" rx="4"/>
    <circle cx="343" cy="250" r="2.5" fill="#161616"/><path d="M343 253v5"/>
  </g>
  <text x="381" y="229" fill="#161616" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing=".7">APPROVED ALGORITHM</text>
  <text x="381" y="250" fill="#686861" font-family="Arial,Helvetica,sans-serif" font-size="10">runs beside protected records</text>
  <path d="M324 291h185" stroke="#D3D3CE"/>
  <circle cx="334" cy="310" r="3" fill="#161616"/><text x="346" y="314" fill="#686861" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing=".8">MEASURED · VERIFIED · ISOLATED</text>

  <path d="M566 232h54" stroke="#686861" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="573" y="215" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing=".8">AGGREGATE</text>
  <text x="625" y="104" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">RESEARCH</text>
  <text x="625" y="124" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing=".5">result leaves enclave</text>
  <rect x="624" y="157" width="98" height="151" rx="3" fill="#fff" stroke="#161616" stroke-width="1.4"/>
  <path d="M642 280v-35m18 35v-57m18 57v-77m18 77v-45" stroke="#161616" stroke-width="8" stroke-linecap="square"/>
  <path d="M640 290h67" stroke="#D3D3CE"/>
  <text x="644" y="303" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing=".7">NO RAW RECORDS</text>

  <path d="M42 421h676" stroke="#D3D3CE"/>
  <text x="42" y="461" fill="#161616" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">Personal data is processed inside a measured boundary.</text>
  <text x="42" y="485" fill="#686861" font-family="Arial,Helvetica,sans-serif" font-size="11">Only the computation result is returned to the caller.</text>
  <g transform="translate(42 516)" stroke="#777770" stroke-width="1.2">
    <rect x="0.6" y=".6" width="10.8" height="10.8" rx="2"/><path d="M3.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5"/>
    <text x="19" y="10" fill="#686861" stroke="none" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1">DATA PROTECTION BY DESIGN</text>
  </g>
</svg>
