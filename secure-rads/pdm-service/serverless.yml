service: secure-rads-pdm-service

# Bundled as CJS, not ESM, same as verifier-service - esbuild's ESM output can't interop with plain
# top-level require() in some deps, and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${param:region, 'ap-southeast-2'}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:Query
          Resource: !GetAtt PersonalDataTable.Arn
        - Effect: Allow
          Action: dynamodb:GetItem
          Resource: !GetAtt DataKeyTable.Arn
  environment:
    PDM_TABLE: !Ref PersonalDataTable
    DATA_KEY_TABLE: !Ref DataKeyTable
    LOG_HOST: ${param:logHost, 'log.sr.secure-rads.org'}
    COST_HOST: ${param:costHost, 'cost.sr.secure-rads.org'}
    VERIFIER_JWKS_URL: ${param:verifierJwksUrl, 'https://verifier-attest.sr.secure-rads.org/.well-known/jwks.json'}
    VERIFIER_JWKS_PUBKEY_SHA256: ${param:verifierJwksPubkeySha256, 'f447d6a73bc9309977d316032a51ea53ce3d0c0867a603ab823c0adb69fd08f0'}

functions:
  records:
    handler: src/handlers/records.handler
    events:
      - httpApi:
          method: GET
          path: /records
  subject:
    handler: src/handlers/subject.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          method: GET
          path: /subject/{dataSubjectId}

resources:
  Resources:
    PersonalDataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
          - AttributeName: RecordId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH
          - AttributeName: RecordId
            KeyType: RANGE

    DataKeyTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH

    # Plain server-auth TLS only - the enclave authenticates with the bearer access token it got from
    # verifier-service's /attest, not a client cert (which would be extractable from the EIF).
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

  Outputs:
    PersonalDataTableName:
      Value: !Ref PersonalDataTable
    DataKeyTableName:
      Value: !Ref DataKeyTable
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
