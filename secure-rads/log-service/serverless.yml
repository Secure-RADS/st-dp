service: secure-rads-log-service

# Bundled as CJS, not ESM, same as pdm-service - esbuild's ESM output can't interop with plain
# top-level require() in some deps, and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${param:region, 'ap-southeast-2'}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:BatchWriteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt RunLogTable.Arn
            - !GetAtt SubjectAccessTable.Arn
            # Querying a GSI needs the index ARN, which is not covered by the table ARN.
            - !Sub "${RunLogTable.Arn}/index/*"
            - !Sub "${SubjectAccessTable.Arn}/index/*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - !GetAtt EventQueue.Arn
            - !GetAtt EventDeadLetterQueue.Arn
  environment:
    RUN_LOG_TABLE: !Ref RunLogTable
    SUBJECT_ACCESS_TABLE: !Ref SubjectAccessTable
    EVENT_QUEUE_URL: !Ref EventQueue

functions:
  events:
    handler: src/handlers/events.handler
    events:
      - httpApi:
          method: POST
          path: /events
  worker:
    handler: src/handlers/worker.handler
    timeout: 30
    reservedConcurrency: 5
    events:
      - sqs:
          arn: !GetAtt EventQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
  byAlgorithm:
    handler: src/handlers/byAlgorithm.handler
    events:
      - httpApi:
          method: GET
          path: /logs/{algorithmId}
  all:
    handler: src/handlers/all.handler
    events:
      - httpApi:
          method: GET
          path: /logs
  byRun:
    handler: src/handlers/byRun.handler
    events:
      - httpApi:
          method: GET
          path: /runs/{runId}
  subjectAccessIngest:
    handler: src/handlers/subjectAccessIngest.handler
    events:
      - httpApi:
          method: POST
          path: /subject-access
  subjectAccessBySubject:
    handler: src/handlers/subjectAccessBySubject.handler
    events:
      - httpApi:
          method: GET
          path: /subject-access/{dataSubjectId}
  subjectAccessAll:
    handler: src/handlers/subjectAccessAll.handler
    events:
      - httpApi:
          method: GET
          path: /subject-access
  subjectAccessByAlgorithm:
    handler: src/handlers/subjectAccessByAlgorithm.handler
    events:
      - httpApi:
          method: GET
          path: /subject-access/by-algorithm/{algorithmId}

resources:
  Resources:
    # Two GSIs here. DynamoDB builds at most one index per UpdateTable, so on an already-deployed stack
    # these must land in two separate deploys; on a fresh create both are built at once.
    RunLogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
          - AttributeName: Sk
            AttributeType: S
          - AttributeName: LogPartition
            AttributeType: S
          - AttributeName: RunIdKey
            AttributeType: S
          - AttributeName: Timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH
          - AttributeName: Sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          # Cross-algorithm chronological export. The partition key is the constant "EVENT" so every event
          # lands in one partition ordered by Timestamp - a deliberate hot partition, acceptable because this
          # log is low-rate benchmarking data and the alternative is sorting a full scan in the Lambda.
          - IndexName: TimelineIndex
            KeySchema:
              - AttributeName: LogPartition
                KeyType: HASH
              - AttributeName: Timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # Per-run timeline across algorithms. Sparse: RunIdKey is only written for execution events, so
          # build events (which have no runId) are simply absent from this index.
          - IndexName: RunIndex
            KeySchema:
              - AttributeName: RunIdKey
                KeyType: HASH
              - AttributeName: Timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Visibility must exceed the worker timeout so in-flight batches are not redelivered mid-PutItem.
    EventQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt EventDeadLetterQueue.Arn
          maxReceiveCount: 5

    EventDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600

    # Separate from the run log: partition key is the data subject so a DSAR lookup is a key query, not a scan.
    SubjectAccessTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: DataSubjectId
            AttributeType: S
          - AttributeName: Sk
            AttributeType: S
          - AttributeName: AlgorithmId
            AttributeType: S
        KeySchema:
          - AttributeName: DataSubjectId
            KeyType: HASH
          - AttributeName: Sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          # Inverts the table: which data subjects an algorithm touched. Reuses the base table's own Sk,
          # which starts with the timestamp, so results come back chronological per algorithm for free.
          - IndexName: AlgorithmIndex
            KeySchema:
              - AttributeName: AlgorithmId
                KeyType: HASH
              - AttributeName: Sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Plain server-auth TLS only - producers are internal SCE components on a trusted network, and the
    # log is fire-and-forget benchmarking data, not a secret store, so no client cert is required.
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

  Outputs:
    RunLogTableName:
      Value: !Ref RunLogTable
    EventQueueUrl:
      Value: !Ref EventQueue
    EventDeadLetterQueueUrl:
      Value: !Ref EventDeadLetterQueue
    SubjectAccessTableName:
      Value: !Ref SubjectAccessTable
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
