AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CSAV stack: EC2 instance running the CSAV module.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    Description: EC2 instance type for the CSAV instance. t4g.nano's 0.5GB RAM can't handle composing real-sized images (OOM/swap thrashing) - t4g.small (2GB) is the smallest step up that comfortably does.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access.

  AppPort:
    Type: Number
    Default: 8080
    Description: Port the registry-service app listens on, exposed publicly.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch the CSAV instance in (the account's default VPC).

  ArtifactBucketName:
    Type: String
    Description: Name of the registry-service artifact bucket (from the registry-service-storage stack), for the instance's S3 write permission.

  AlgorithmTableName:
    Type: String
    Description: Name of the registry-service AlgorithmId->S3 path table (from the registry-service-storage stack), for the instance's DynamoDB write permission.

  ArtifactBucketKmsKeyArn:
    Type: String
    Description: ARN of the KMS key for the artifact bucket (from the registry-service-storage stack). Required to PUT EIF objects with SSE-KMS.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  CsavSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the CSAV instance.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  CsavInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ArtifactBucketWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucketName}/*"
        # SSE-KMS on the artifact bucket: GenerateDataKey to create the data key,
        # and Decrypt because S3 multipart upload part calls also require it.
        - PolicyName: ArtifactBucketCrypto
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !Ref ArtifactBucketKmsKeyArn
        # The CSAV builds one PCR-bound KMS key per algorithm (registry-service provisions it after the EIF
        # build, when the measurements are known). CreateKey is a management call with no key resource.
        - PolicyName: KmsProvisionAlgorithmKeys
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [kms:CreateKey, kms:ListKeys, kms:DescribeKey]
                Resource: "*"
        - PolicyName: AlgorithmTableWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AlgorithmTableName}"

  CsavInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CsavInstanceRole

  CsavInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref CsavInstanceProfile
      SecurityGroupIds:
        - !Ref CsavSecurityGroup
      MetadataOptions:
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y docker
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # docker-compose-plugin isn't in the AL2023 default repo; standalone binary instead.
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64 \
            -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          ln -s /usr/local/bin/docker-compose /usr/libexec/docker/cli-plugins/docker-compose 2>/dev/null || \
            (mkdir -p /usr/libexec/docker/cli-plugins && ln -s /usr/local/bin/docker-compose /usr/libexec/docker/cli-plugins/docker-compose)
      Tags:
        - Key: Name
          Value: csav

Outputs:
  CsavInstanceId:
    Value: !Ref CsavInstance

  CsavInstancePublicIp:
    Value: !GetAtt CsavInstance.PublicIp

  CsavInstanceRoleArn:
    Value: !GetAtt CsavInstanceRole.Arn
