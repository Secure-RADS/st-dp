AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CSAV stack: EC2 instance running the CSAV module.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    Description: EC2 instance type for the CSAV instance. t4g.nano's 0.5GB RAM can't handle composing real-sized images (OOM/swap thrashing) - t4g.small (2GB) is the smallest step up that comfortably does.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access.

  AppPort:
    Type: Number
    Default: 8080
    Description: Port the registry-service app listens on, exposed publicly.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch the CSAV instance in (the account's default VPC).

  ArtifactBucketName:
    Type: String
    Description: Name of the registry-service artifact bucket (from the secure-rads-registry-service-storage stack), for the instance's S3 write permission.

  AlgorithmTableName:
    Type: String
    Description: Name of the registry-service AlgorithmId->S3 path table (from the secure-rads-registry-service-storage stack), for the instance's DynamoDB write permission.

  ArtifactBucketKmsKeyArn:
    Type: String
    Description: ARN of the KMS key for the artifact bucket (from the secure-rads-registry-service-storage stack). Required to PUT EIF objects with SSE-KMS.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  CsavSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the CSAV instance.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  CsavInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ArtifactBucketWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucketName}/*"
        # SSE-KMS on the artifact bucket: GenerateDataKey to create the data key,
        # and Decrypt because S3 multipart upload part calls also require it.
        - PolicyName: ArtifactBucketCrypto
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !Ref ArtifactBucketKmsKeyArn
        # The CSAV builds one PCR-bound KMS key per algorithm (registry-service provisions it after the EIF
        # build, when the measurements are known) and reuses it on rebuild, rewriting the policy. CreateKey is a
        # management call with no key resource; Get/PutKeyPolicy act on the algorithm's own key.
        - PolicyName: KmsProvisionAlgorithmKeys
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [kms:CreateKey, kms:ListKeys, kms:DescribeKey, kms:GetKeyPolicy, kms:PutKeyPolicy]
                Resource: "*"
        - PolicyName: AlgorithmTableWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AlgorithmTableName}"

  CsavInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CsavInstanceRole

  CsavInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref CsavInstanceProfile
      SecurityGroupIds:
        - !Ref CsavSecurityGroup
      MetadataOptions:
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # docker-compose-plugin isn't in the AL2023 default repo; standalone binary instead.
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64 \
            -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          ln -s /usr/local/bin/docker-compose /usr/libexec/docker/cli-plugins/docker-compose 2>/dev/null || \
            (mkdir -p /usr/libexec/docker/cli-plugins && ln -s /usr/local/bin/docker-compose /usr/libexec/docker/cli-plugins/docker-compose)

          # Compose file is baked at first boot (see secure-rads/csav/docker-compose.yml - keep in sync).
          # ship only pushes the image tarball + .env; compose is no longer scp'd per deploy.
          install -d -o ec2-user -g ec2-user /home/ec2-user/registry-service
          cat > /home/ec2-user/registry-service/docker-compose.yml <<'COMPOSE'
          services:
            registry-service:
              image: registry-service:latest
              ports:
                - "8080:8080"
              environment:
                - ARTIFACT_BUCKET=${!ARTIFACT_BUCKET}
                - AWS_REGION=${!AWS_REGION}
                - DYNAMO_TABLE=${!DYNAMO_TABLE}
                - VERIFIER_URL=${!VERIFIER_URL}
                - VERIFIER_PUBKEY_SHA256=${!VERIFIER_PUBKEY_SHA256}
                - VERIFIER_HOST=${!VERIFIER_HOST}
                - VERIFIER_HOST_PUBKEY_SHA256=${!VERIFIER_HOST_PUBKEY_SHA256}
                - PDM_HOST=${!PDM_HOST}
                - PDM_HOST_PUBKEY_SHA256=${!PDM_HOST_PUBKEY_SHA256}
                - LOG_HOST=${!LOG_HOST}
                - LOG_HOST_PUBKEY_SHA256=${!LOG_HOST_PUBKEY_SHA256}
                - ENCLAVE_HOST_ROLE_ARN=${!ENCLAVE_HOST_ROLE_ARN}
                - CSAV_ROLE_ARN=${!CSAV_ROLE_ARN}
              restart: unless-stopped
          COMPOSE
          chown ec2-user:ec2-user /home/ec2-user/registry-service/docker-compose.yml

          # Starts the stack when .env exists (after the first ship). Skips cleanly on first boot.
          cat > /etc/systemd/system/csav-registry.service <<'UNIT'
          [Unit]
          Description: CSAV registry-service docker compose stack
          After=docker.service
          Requires=docker.service
          ConditionPathExists=/home/ec2-user/registry-service/.env

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/home/ec2-user/registry-service
          ExecStart=/usr/local/bin/docker-compose up -d
          ExecStop=/usr/local/bin/docker-compose down

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable csav-registry.service
      Tags:
        - Key: Name
          Value: secure-rads-csav

Outputs:
  CsavInstanceId:
    Value: !Ref CsavInstance

  CsavInstancePublicIp:
    Value: !GetAtt CsavInstance.PublicIp

  CsavInstanceRoleArn:
    Value: !GetAtt CsavInstanceRole.Arn
