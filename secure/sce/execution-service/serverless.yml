service: secure-rads-execution-service

build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

package:
  patterns:
    - userdata.sh.tmpl

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:GetItem
          Resource:
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${param:algorithmTable}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${param:runResultsTable}"
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/secure-rads/pdm-service/client-cert"
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/secure-rads/pdm-service/client-key"
        - Effect: Allow
          Action: kms:Decrypt
          Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
          Condition:
            StringEquals:
              "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"
        - Effect: Allow
          Action: ec2:RunInstances
          Resource:
            - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
            - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
            - !Sub "arn:aws:ec2:${AWS::Region}::image/*"
            - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
            - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
        - Effect: Allow
          Action: ec2:CreateTags
          Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
          Condition:
            StringEquals:
              "ec2:CreateAction": RunInstances
        - Effect: Allow
          Action: iam:PassRole
          Resource: !GetAtt EnclaveHostInstanceRole.Arn
  environment:
    ALGORITHM_TABLE: ${param:algorithmTable}
    RUN_RESULTS_TABLE: ${param:runResultsTable}
    RUN_RESULTS_QUEUE_URL: ${param:runResultsQueueUrl}
    # Pinned to match rads EXECUTOR_AMI_ID so both trees boot the same AL2023 arm64 build.
    ENCLAVE_AMI_ID: ${env:SCE_ENCLAVE_AMI_ID}
    ENCLAVE_INSTANCE_TYPE: ${param:enclaveInstanceType, 'c6g.large'}
    # Same AZ as rads EXECUTOR_AZ so both trees launch side by side.
    ENCLAVE_AZ: ${env:AVAILABILITY_ZONE}
    ENCLAVE_SECURITY_GROUP_ID: !Ref EnclaveHostSecurityGroup
    ENCLAVE_INSTANCE_PROFILE_ARN: !GetAtt EnclaveHostInstanceProfile.Arn
    VERIFIER_HOST: ${env:VERIFIER_ATTEST_HOST}
    PDM_HOST: ${env:PDM_HOST}
    PDM_MTLS_HOST: ${param:pdmMtlsHost}
    PDM_MTLS_CERT_PARAM: /secure-rads/pdm-service/client-cert
    PDM_MTLS_KEY_PARAM: /secure-rads/pdm-service/client-key
    KMS_SERVICE_HOST: ${env:KMS_HOST}
    LOG_HOST: ${env:LOG_HOST_SECURE_RADS}
    TELEMETRY_HOST: ${env:TELEMETRY_HOST_SECURE_RADS}
    COST_HOST: ${env:COST_HOST_SECURE_RADS}

functions:
  run:
    handler: src/handlers/run.create
    timeout: 29
    events:
      - httpApi:
          method: POST
          path: /run
  result:
    handler: src/handlers/run.result
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /run/{runId}

resources:
  Resources:
    EnclaveHostSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for per-run Nitro Enclave host instances.
        VpcId: ${param:vpcId}
        SecurityGroupEgress:
          - IpProtocol: "-1"
            CidrIp: 0.0.0.0/0

    EnclaveHostInstanceRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ec2.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ArtifactBucketRead
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "arn:aws:s3:::${param:artifactBucket}/*"
          - PolicyName: SelfTerminate
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ec2:TerminateInstances
                  Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  Condition:
                    StringEquals:
                      "ec2:ResourceTag/ManagedBy": secure-rads-execution-service
          - PolicyName: SendRunResult
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource: ${param:runResultsQueueArn}

    EnclaveHostInstanceProfile:
      Type: AWS::IAM::InstanceProfile
      Properties:
        Roles:
          - !Ref EnclaveHostInstanceRole

  Outputs:
    ExecutionApiUrl:
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    EnclaveHostSecurityGroupId:
      Value: !Ref EnclaveHostSecurityGroup
    EnclaveHostInstanceProfileArn:
      Value: !GetAtt EnclaveHostInstanceProfile.Arn
    EnclaveHostInstanceRoleArn:
      Value: !GetAtt EnclaveHostInstanceRole.Arn
