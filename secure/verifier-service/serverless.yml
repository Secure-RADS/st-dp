service: secure-rads-verifier-service

# Bundled as CJS, not ESM, even though package.json has "type": "module" (for local tooling only) - cbor does
# a plain top-level require('stream') that esbuild's ESM output can't interop with ("Dynamic require of
# 'stream' is not supported"), and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    disableDefaultEndpoint: true # mTLS is only enforced on the custom domain below - the default execute-api endpoint bypasses it entirely.
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:PutItem
          Resource: !GetAtt AlgorithmPCRTable.Arn
        - Effect: Allow
          Action: dynamodb:GetItem
          Resource: !GetAtt AlgorithmPCRTable.Arn
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource: !GetAtt AttestationSessionTable.Arn
        - Effect: Allow
          Action: dynamodb:Query
          Resource: !Sub "${AttestationSessionTable.Arn}/index/RefreshTokenIndex"
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource: !GetAtt AttestationChallengeTable.Arn
        - Effect: Allow
          Action: ssm:GetParameter
          Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/secure-rads/verifier-service/jwt-signing-key"
  environment:
    ALGORITHM_PCR_TABLE: !Ref AlgorithmPCRTable
    ATTESTATION_SESSION_TABLE: !Ref AttestationSessionTable
    ATTESTATION_CHALLENGE_TABLE: !Ref AttestationChallengeTable
    JWT_SIGNING_KEY_PARAM: /secure-rads/verifier-service/jwt-signing-key
    COST_HOST: ${env:COST_HOST_SECURE_RADS}

functions:
  registerAlgorithm:
    handler: src/handlers/registerAlgorithm.handler
    events:
      - httpApi:
          method: POST
          path: /algorithms

  # attest/challenge/refresh are plain TLS: wired by hand to PublicHttpApi in resources below, not the mTLS httpApi.
  challenge:
    handler: src/handlers/challenge.handler

  attest:
    handler: src/handlers/attest.handler

  refresh:
    handler: src/handlers/refresh.handler

  # jwks is on the public domain only - it publishes the ML-DSA-87 public key downstream services verify
  # access JWTs against, locally, with no verifier round-trip (no /validate anymore).
  jwks:
    handler: src/handlers/jwks.handler

resources:
  Conditions:
    HasTruststoreVersion:
      Fn::Not:
        - Fn::Equals:
            - "${param:truststoreVersionId, ''}"
            - ""
  Resources:
    AlgorithmPCRTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH

    # Holds refresh-token state - the mechanism by which sce-unit doesn't have to re-attest on every call,
    # and the row-level Revoked flag that cuts off a compromised session. Access tokens are stateless
    # self-contained JWTs, so they no longer live here (see jwks.ts / tokens.ts).
    AttestationSessionTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: SessionId
            AttributeType: S
          - AttributeName: RefreshTokenHash
            AttributeType: S
        KeySchema:
          - AttributeName: SessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: RefreshTokenIndex
            KeySchema:
              - AttributeName: RefreshTokenHash
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # Single-use nonces that bind a Nitro attestation document to one /attest request. Rows are small and
    # short-lived; DynamoDB TTL reaps them after expiry and consumeChallenge checks ExpiresAt regardless.
    AttestationChallengeTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ChallengeId
            AttributeType: S
        KeySchema:
          - AttributeName: ChallengeId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ExpiresAt
          Enabled: true

    # PEM bundle containing registry-service's client cert public cert
    # (csav/registry-service/tls/client.crt) - upload it here before deploy.
    TruststoreBucket:
      Type: AWS::S3::Bucket
      Properties:
        VersioningConfiguration:
          Status: Enabled

    # mTLS is enforced here, not on the Lambda/HTTP API itself - the default
    # execute-api endpoint is disabled above so this is the only way in.
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Condition: HasTruststoreVersion
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}
        MutualTlsAuthentication:
          TruststoreUri: !Sub "s3://${TruststoreBucket}/${param:truststoreKey, 'truststore.pem'}"
          TruststoreVersion: ${param:truststoreVersionId, ''}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: HasTruststoreVersion
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

    # Separate API from the mTLS one above - /challenge, /attest, /refresh, /.well-known/jwks.json are plain server-auth
    # TLS, pinned to this domain's leaf pubkey by callers instead (sce-unit has no client cert to present).
    PublicHttpApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: secure-rads-verifier-service-public
        ProtocolType: HTTP

    PublicHttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref PublicHttpApi
        StageName: $default
        AutoDeploy: true

    AttestIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt AttestLambdaFunction.Arn
        PayloadFormatVersion: "2.0"

    AttestRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: POST /attest
        Target: !Sub "integrations/${AttestIntegration}"

    AttestInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref AttestLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/*/attest"

    ChallengeIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt ChallengeLambdaFunction.Arn
        PayloadFormatVersion: "2.0"

    ChallengeRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: POST /challenge
        Target: !Sub "integrations/${ChallengeIntegration}"

    ChallengeInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref ChallengeLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/*/challenge"

    RefreshIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt RefreshLambdaFunction.Arn
        PayloadFormatVersion: "2.0"

    RefreshRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: POST /refresh
        Target: !Sub "integrations/${RefreshIntegration}"

    RefreshInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref RefreshLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/*/refresh"

    JwksIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt JwksLambdaFunction.Arn
        PayloadFormatVersion: "2.0"

    JwksRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: "GET /.well-known/jwks.json"
        Target: !Sub "integrations/${JwksIntegration}"

    JwksInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref JwksLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/*/*"

    PublicApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:publicDomainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:publicCertificateArn}

    PublicApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref PublicApiCustomDomain
        ApiId: !Ref PublicHttpApi
        Stage: !Ref PublicHttpApiStage

  Outputs:
    AlgorithmPCRTableName:
      Value: !Ref AlgorithmPCRTable
    AttestationSessionTableName:
      Value: !Ref AttestationSessionTable
    AttestationChallengeTableName:
      Value: !Ref AttestationChallengeTable
    TruststoreBucketName:
      Value: !Ref TruststoreBucket
    ApiRegionalDomainName:
      Condition: HasTruststoreVersion
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
    PublicApiRegionalDomainName:
      Value: !GetAtt PublicApiCustomDomain.RegionalDomainName
