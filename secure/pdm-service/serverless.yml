service: secure-rads-pdm-service

# Bundled as CJS, not ESM, same as verifier-service - esbuild's ESM output can't interop with plain
# top-level require() in some deps, and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:Query
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/secure-rads-personal-data-*"
        - Effect: Allow
          Action: kms:Decrypt
          Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
          Condition:
            StringEquals:
              "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
  environment:
    PDM_TABLE_PREFIX: secure-rads-personal-data
    LOG_HOST: ${env:LOG_HOST_SECURE_RADS}
    COST_HOST: ${env:COST_HOST_SECURE_RADS}
    VERIFIER_JWKS_URL: ${env:VERIFIER_JWKS_URL}
    VERIFIER_JWKS_PUBKEY_SHA256: ${env:VERIFIER_JWKS_PUBKEY_SHA256}

functions:
  records:
    handler: src/handlers/records.handler
    timeout: 29
    events:
      - httpApi:
          method: GET
          path: /records
  # Reached only through the mTLS API below; no event on the plain httpApi.
  count:
    handler: src/handlers/count.handler
    timeout: 29
  subject:
    handler: src/handlers/subject.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          method: GET
          path: /subject/{dataSubjectId}

resources:
  Conditions:
    HasTruststoreVersion:
      Fn::Not:
        - Fn::Equals:
            - "${param:truststoreVersionId, ''}"
            - ""

  Resources:
    DataKeyTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH

    TruststoreBucket:
      Type: AWS::S3::Bucket
      Properties:
        VersioningConfiguration:
          Status: Enabled

    # Internal API for the execution-service size check. mTLS is enforced on its custom domain, and the
    # default execute-api endpoint is disabled so there is no way around the client certificate.
    CountHttpApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: secure-rads-pdm-service-count
        ProtocolType: HTTP
        DisableExecuteApiEndpoint: true

    CountHttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref CountHttpApi
        StageName: $default
        AutoDeploy: true

    CountIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref CountHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt CountLambdaFunction.Arn
        PayloadFormatVersion: "2.0"

    CountRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref CountHttpApi
        RouteKey: GET /count
        AuthorizationType: NONE
        Target: !Join ["integrations/", !Ref CountIntegration]

    CountLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt CountLambdaFunction.Arn
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CountHttpApi}/*/GET/count"

    CountApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Condition: HasTruststoreVersion
      Properties:
        DomainName: ${param:mtlsDomainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:mtlsCertificateArn}
        MutualTlsAuthentication:
          TruststoreUri: !Sub "s3://${TruststoreBucket}/${param:truststoreKey, 'truststore.pem'}"
          TruststoreVersion: ${param:truststoreVersionId, ''}

    CountApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: HasTruststoreVersion
      Properties:
        DomainName: !Ref CountApiCustomDomain
        ApiId: !Ref CountHttpApi
        Stage: !Ref CountHttpApiStage

    # Plain server-auth TLS only - the enclave authenticates with the bearer access token it got from
    # verifier-service's /attest, not a client cert (which would be extractable from the EIF).
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

  Outputs:
    PdmMtlsHost:
      Value: ${param:mtlsDomainName}
    PdmTruststoreBucketName:
      Value: !Ref TruststoreBucket
    PdmMtlsRegionalDomainName:
      Condition: HasTruststoreVersion
      Value: !GetAtt CountApiCustomDomain.RegionalDomainName
    PdmTablePrefix:
      Value: secure-rads-personal-data
    DataKeyTableName:
      Value: !Ref DataKeyTable
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
