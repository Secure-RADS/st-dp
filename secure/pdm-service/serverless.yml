service: secure-rads-pdm-service

# Bundled as CJS, not ESM, same as verifier-service - esbuild's ESM output can't interop with plain
# top-level require() in some deps, and nothing here actually needs ESM at runtime.
build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action: dynamodb:Query
          Resource: !GetAtt PersonalDataTable.Arn
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/secure-rads/log-service/mtls/clients/pdm-service/cert"
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/secure-rads/log-service/mtls/clients/pdm-service/key"
  environment:
    PDM_TABLE: !Ref PersonalDataTable
    LOG_HOST: ${env:LOG_HOST_SECURE_RADS}
    LOG_MTLS_HOST: ${env:LOG_MTLS_HOST_SECURE_RADS}
    LOG_MTLS_PUBKEY_SHA256: ${env:LOG_MTLS_PUBKEY_SHA256}
    LOG_MTLS_CERT_PARAM: /secure-rads/log-service/mtls/clients/pdm-service/cert
    LOG_MTLS_KEY_PARAM: /secure-rads/log-service/mtls/clients/pdm-service/key
    COST_HOST: ${env:COST_HOST_SECURE_RADS}
    VERIFIER_JWKS_URL: ${env:VERIFIER_JWKS_URL}
    VERIFIER_JWKS_PUBKEY_SHA256: ${env:VERIFIER_JWKS_PUBKEY_SHA256}

functions:
  records:
    handler: src/handlers/records.handler
    events:
      - httpApi:
          method: GET
          path: /records
  subject:
    handler: src/handlers/subject.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          method: GET
          path: /subject/{dataSubjectId}

resources:
  Resources:
    PersonalDataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
          - AttributeName: RecordId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH
          - AttributeName: RecordId
            KeyType: RANGE

    DataKeyTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: AlgorithmId
            AttributeType: S
        KeySchema:
          - AttributeName: AlgorithmId
            KeyType: HASH

    # Plain server-auth TLS only - the enclave authenticates with the bearer access token it got from
    # verifier-service's /attest, not a client cert (which would be extractable from the EIF).
    ApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref ApiCustomDomain
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

  Outputs:
    PersonalDataTableName:
      Value: !Ref PersonalDataTable
    DataKeyTableName:
      Value: !Ref DataKeyTable
    ApiRegionalDomainName:
      Value: !GetAtt ApiCustomDomain.RegionalDomainName
