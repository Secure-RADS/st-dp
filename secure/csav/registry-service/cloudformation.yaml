AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Registry Service storage: S3 bucket for uploaded OCI images and the
  AlgorithmId table. EIF artifacts are stored unencrypted at rest; artifact
  integrity comes from the PCR measurements registered per algorithm.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AlgorithmTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: AlgorithmId
          AttributeType: S
      KeySchema:
        - AttributeName: AlgorithmId
          KeyType: HASH

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  AlgorithmTableName:
    Value: !Ref AlgorithmTable
