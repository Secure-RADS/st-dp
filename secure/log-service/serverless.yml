service: secure-rads-log-service

build:
  esbuild:
    format: cjs
    outExtension:
      ".js": ".cjs"

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION}
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:BatchWriteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt SubjectAccessTable.Arn
  environment:
    SUBJECT_ACCESS_TABLE: !Ref SubjectAccessTable
    # Enables attestation-token verification for subject-access ingest. Left unset in the baseline, which
    # has no verifier.
    VERIFIER_JWKS_URL: ${env:VERIFIER_JWKS_URL}
    VERIFIER_JWKS_PUBKEY_SHA256: ${env:VERIFIER_JWKS_PUBKEY_SHA256}

functions:
  # sce-unit writes the subject-access trail over the public domain after a successful DC app run, using the
  # verifier-issued attested token. The routes are declared under the public API resources below.
  subjectAccessIngest:
    handler: src/handlers/subjectAccessIngest.handler
  subjectAccessBySubject:
    handler: src/handlers/subjectAccessBySubject.handler
  subjectAccessAll:
    handler: src/handlers/subjectAccessAll.handler

resources:
  Resources:
    # The data-subject trail: partition key is the data subject so a DSAR lookup is a key query, not a scan.
    SubjectAccessTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: DataSubjectId
            AttributeType: S
          - AttributeName: Sk
            AttributeType: S
        KeySchema:
          - AttributeName: DataSubjectId
            KeyType: HASH
          - AttributeName: Sk
            KeyType: RANGE

    PublicHttpApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: secure-rads-log-service-public
        ProtocolType: HTTP
        CorsConfiguration:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - content-type
            - authorization

    PublicHttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref PublicHttpApi
        StageName: $default
        AutoDeploy: true

    PublicApiCustomDomain:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:domainName}
        DomainNameConfigurations:
          - CertificateArn: ${param:certificateArn}

    PublicApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        DomainName: !Ref PublicApiCustomDomain
        ApiId: !Ref PublicHttpApi
        Stage: !Ref PublicHttpApiStage

    SubjectAccessIngestIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt SubjectAccessIngestLambdaFunction.Arn
        PayloadFormatVersion: "2.0"
    SubjectAccessIngestRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: POST /subject-access
        Target: !Sub "integrations/${SubjectAccessIngestIntegration}"
    SubjectAccessIngestInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref SubjectAccessIngestLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/POST/subject-access"

    SubjectAccessBySubjectIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt SubjectAccessBySubjectLambdaFunction.Arn
        PayloadFormatVersion: "2.0"
    SubjectAccessBySubjectRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: GET /subject-access/{dataSubjectId}
        Target: !Sub "integrations/${SubjectAccessBySubjectIntegration}"
    SubjectAccessBySubjectInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref SubjectAccessBySubjectLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/GET/subject-access/*"

    SubjectAccessAllIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref PublicHttpApi
        IntegrationType: AWS_PROXY
        IntegrationUri: !GetAtt SubjectAccessAllLambdaFunction.Arn
        PayloadFormatVersion: "2.0"
    SubjectAccessAllRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref PublicHttpApi
        RouteKey: GET /subject-access
        Target: !Sub "integrations/${SubjectAccessAllIntegration}"
    SubjectAccessAllInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref SubjectAccessAllLambdaFunction
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApi}/*/GET/subject-access"

  Outputs:
    SubjectAccessTableName:
      Value: !Ref SubjectAccessTable
    PublicApiRegionalDomainName:
      Value: !GetAtt PublicApiCustomDomain.RegionalDomainName
